services:
  postgres-db:
    image: postgres:16-alpine
    container_name: banco_ecotrack
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ecotrack_77as_user
      - POSTGRES_PASSWORD=Dyq8gxsPRpWfFXlQBrdm83jbnYAh0OsP
      - POSTGRES_DB=dpg-dbv29lgm7kps73a1c810-a.oregon-postgres.render.com
    volumes:
      - postgres-data-local:/var/lib/postgresql/data

  api-spring:
    container_name: ecotrak-api
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://dpg-dbv29lgm7kps73a1c810-a.oregon-postgres.render.com/ecotrack_77as
      - SPRING_DATASOURCE_USERNAME=ecotrack_77as_user
      - SPRING_DATASOURCE_PASSWORD=Dyq8gxsPRpWfFXlQBrdm83jbnYAh0OsP
    depends_on:
      - postgres-db

volumes:
  postgres-data-local: